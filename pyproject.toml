[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minicodex-local"
version = "0.1.0"
description = "A local MiniCodex learning agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
]

[project.scripts]
minicodex = "minicodex.agent:main"

[tool.setuptools]
packages = ["minicodex", "tools"]
